name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: abangta_test
          MYSQL_USER: abangta_ci
          MYSQL_PASSWORD: ci-test-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://abangta_ci:ci-test-only@127.0.0.1:3306/abangta_test
      AUTH_SECRET: ci-only-placeholder-secret-never-use-in-production-123456
      AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      ABANGTA_DB_TESTS: '1'
      BILL_REMINDERS_AUTOMATIC: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:migrate:prod
      - run: npm run lint
      - run: npm run typecheck -- --incremental false
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test -- --runInBand
      - run: npm run test:ops
      - run: npm run test:scheduler
      - run: npm run build
